<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>创建vue实例</title>
</head>
<body>
   <div id="app">
    {{msg.toUpperCase()}}
   </div>
   <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>
   <script>
    const app=new Vue(
        {
            el:'#app',
            data:{
                msg:'tony'
            }
        }
    )
   </script>
</body>
</html>

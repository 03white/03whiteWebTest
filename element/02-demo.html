<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>第02课 · 文本与列表</title>
</head>
<body>
    <!-- 标题有 h1~h6 六级,h1 最大,按重要性用,别只为了大小 -->
    <h1>一级标题</h1>
    <h2>二级标题</h2>
    <h3>三级标题</h3>

    <!-- 段落 -->
    <p>这是一个普通段落。段落之间浏览器会自动留空隙。</p>

    <!-- 行内文本强调 -->
    <p>
        这里有 <strong>加粗强调(strong)</strong> 和
        <em>斜体强调(em)</em>,还有一段
        <span>普通的 span(本身没样式,常用来配合 CSS)</span>。
    </p>

    <!-- 无序列表:圆点 -->
    <h2>我喜欢的水果(无序列表)</h2>
    <ul>
        <li>苹果</li>
        <li>香蕉</li>
        <li>橘子</li>
    </ul>

    <!-- 有序列表:数字 -->
    <h2>泡面步骤(有序列表)</h2>
    <ol>
        <li>烧水</li>
        <li>放面饼和调料</li>
        <li>等三分钟</li>
    </ol>

    <!-- 列表可以嵌套 -->
    <h2>嵌套列表</h2>
    <ul>
        <li>前端
            <ul>
                <li>HTML</li>
                <li>CSS</li>
            </ul>
        </li>
        <li>后端</li>
    </ul>

    <!-- 分隔线 -->
    <hr>
    <p>上面是一条水平分隔线 hr。</p>
    <ul>
        <li><strong>hhh</strong>首页</li>
        <li>关于</li>
        <li>联系</li>
    </ul>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>第01课 · HTML 骨架，加了一句话</title>
    <!-- head 里的内容不会显示在页面上,是给浏览器看的 -->
</head>
<body>
    <!-- body 里的才会显示 -->
    <h1>这是最大的标题 h1</h1>
    <p>这是一个段落 p。HTML 用标签描述内容的结构。</p>
    <p>我cnm</p>
    <p>下面演示一个带属性的链接和一个自闭合标签(换行):</p>
    <a href="https://developer.mozilla.org/zh-CN/">点我去 MDN(权威前端文档)</a>
    <br>
    <br>

    <!-- 演示嵌套:section 里套 p -->
    <section>
        <p>我被 section 包住,这叫嵌套。</p>
    </section>

    <!-- 这是注释,页面上看不到 -->
</body>
</html>

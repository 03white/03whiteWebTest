<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>第06课 · Flexbox</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        h2 { margin-top: 30px; }
        .box { background: #90caf9; padding: 20px; text-align: center; border-radius: 6px; }

        /* 1. 基础:横向排列 */
        .flex-row {
            display: flex;
            gap: 10px;                 /* 子项间距 */
            background: #eee; padding: 10px;
        }

        /* 2. 两端对齐:典型导航栏布局 */
        .navbar {
            display: flex;
            justify-content: space-between;  /* logo 左,菜单右 */
            align-items: center;
            background: #1976d2; color: #fff;
            padding: 12px 20px; border-radius: 6px;
        }
        .navbar a { color: #fff; margin-left: 16px; text-decoration: none; }

        /* 3. 万能居中 */
        .center-box {
            display: flex;
            justify-content: center;   /* 水平居中 */
            align-items: center;       /* 垂直居中 */
            height: 150px;
            background: #c8e6c9; border-radius: 6px;
        }

        /* 4. 等分:flex:1 */
        .equal { display: flex; gap: 10px; }
        .equal .box { flex: 1; }          /* 三个平分 */
        .equal .wide { flex: 2; background: #f48fb1; } /* 这个占两份 */

        /* 5. 换行卡片墙 */
        .wall { display: flex; flex-wrap: wrap; gap: 12px; }
        .wall .box { width: 120px; }
    </style>
</head>
<body>
    <h1>Flexbox 弹性布局</h1>

    <h2>1. 横向排列 + gap</h2>
    <div class="flex-row">
        <div class="box">1</div><div class="box">2</div><div class="box">3</div>
    </div>

    <h2>2. 导航栏(space-between)</h2>
    <div class="navbar">
        <strong>我的网站</strong>
        <div>
            <a href="#">首页</a><a href="#">关于</a><a href="#">联系</a>
        </div>
    </div>

    <h2>3. 万能居中(水平+垂直)</h2>
    <div class="center-box"><div class="box">我在正中央</div></div>

    <h2>4. 等分(flex:1),粉色那个 flex:2</h2>
    <div class="equal">
        <div class="box">1份</div>
        <div class="box wide">2份</div>
        <div class="box">1份</div>
    </div>

    <h2>5. 卡片墙(flex-wrap:wrap)</h2>
    <div class="wall">
        <div class="box">A</div><div class="box">B</div><div class="box">C</div>
        <div class="box">D</div><div class="box">E</div><div class="box">F</div>
    </div>
</body>
</html>
